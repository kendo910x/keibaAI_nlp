_config_version: 50
model:
  provider: custom:keiba-research
  default: halogen-qwen3.8-flash-next
  base_url: http://192.168.0.13:8731/v1
  context_length: 262144
fallback_model: []
providers:
  keiba-research:
    base_url: http://192.168.0.13:8731/v1
    default_model: halogen-qwen3.8-flash-next
    api_mode: chat_completions
    extra_body:
      max_tokens: -1
      reasoning_effort: xhigh
      chat_template_kwargs: {enable_thinking: true}
agent: {reasoning_effort: xhigh}
delegation:
  max_concurrent_children: 1
  max_spawn_depth: 1
  oneshot_max_children: 4
  max_iterations: 15
  inherit_mcp_toolsets: true
  subagent_auto_approve: false
timeouts:
  tools: {sequential_call: 1950, concurrent_batch: 1950}
compression:
  enabled: true
  threshold: 0.50
  threshold_tokens: 131072
  target_ratio: 0.2
  protect_last_n: 20
auxiliary:
  compression:
    provider: custom
    model: halogen-qwen3.8-flash-next
    base_url: http://192.168.0.13:8731/v1
    extra_body:
      max_tokens: 32768
      chat_template_kwargs:
        enable_thinking: true
  vision: &local
    provider: custom
    model: halogen-qwen3.8-flash-next
    base_url: http://192.168.0.13:8731/v1
  approval: *local
  skills_hub: *local
  mcp: *local
  review: *local
  memory_query_rewrite: *local
  profile_describer: *local
  goal_judge: *local
  curator: *local
  monitor: *local
  triage_specifier: *local
  kanban_decomposer: *local
  tts_audio_tags: *local
  voice_chat: *local
  moa_reference: *local
  moa_aggregator: *local
  title_generation:
    <<: *local
    model_upgrade_enabled: false
  background_review:
    <<: *local
    enabled: false
memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false
skills:
  write_approval: false
terminal:
  cwd: /opt/nlp-research
tools:
  tool_search:
    enabled: "off"
platform_toolsets:
  cli: [skills, memory, session_search, delegation, mcp-collection, mcp-nlpdb, mcp-shared]
  cron: [skills, delegation, mcp-collection]
mcp_servers:
  collection:
    command: /opt/nlp-db/venv/bin/python
    args: [-B, /opt/keiba/collection_mcp.py]
    env:
      KEIBA_RESEARCH_DIR: /var/lib/keiba
      KEIBA_RUNTIME_DB: "1"
      KEIBA_RESEARCH_ACTOR: hermes
      KEIBA_BROWSER_EXECUTABLE: /usr/bin/chromium
      KEIBA_INTERPRET_SKILL: /opt/data/skills/keiba-interpret/SKILL.md
      TZ: Asia/Tokyo
    timeout: 1950
    tools: {resources: false, prompts: false}
    sampling: {enabled: false}
  nlpdb:
    command: /opt/nlp-db/venv/bin/python
    args: [-B, /opt/nlp-db/server.py]
    tools:
      include: [find_articles, get_article, find_horses, find_races, get_runs]
      resources: false
      prompts: false
    sampling: {enabled: false}
  shared:
    url: http://192.168.0.11:30081/mcp
    tools:
      include: [fetch_page, yahoo_search]
      resources: false
      prompts: false
    sampling: {enabled: false}
